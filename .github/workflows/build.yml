name: Test e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm install --no-save playwright
      - run: npm run test:e2e

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      # Chiave di firma FISSA: serve per aggiornare l'app senza perdere le note.
      - name: Installa la chiave di firma fissa
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - run: npx cap add android
      - name: Permesso per allarmi esatti (timer)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q SCHEDULE_EXACT_ALARM $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' $f
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: note-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
