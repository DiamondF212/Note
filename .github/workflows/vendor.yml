name: Scarica librerie (vendor)

# Scarica UNA VOLTA le librerie con versioni fissate e le salva in vendor/.
# L'app non le scarica mai da internet: sono dentro l'APK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa le librerie (versioni fisse)
        run: |
          mkdir -p /tmp/v && cd /tmp/v && npm init -y >/dev/null
          npm install --save-exact pdfjs-dist@3.11.174 pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1 mammoth@1.8.0 exceljs@4.4.0
      - name: Copia i file nel repository
        run: |
          rm -rf vendor && mkdir -p vendor/licenses
          N=/tmp/v/node_modules
          cp $N/pdfjs-dist/build/pdf.min.js vendor/pdf.min.js
          cp $N/pdfjs-dist/build/pdf.worker.min.js vendor/pdf.worker.min.js
          cp $N/pdf-lib/dist/pdf-lib.min.js vendor/pdf-lib.min.js
          cp $N/@pdf-lib/fontkit/dist/fontkit.umd.min.js vendor/fontkit.umd.min.js
          cp $N/mammoth/mammoth.browser.min.js vendor/mammoth.browser.min.js
          cp $N/exceljs/dist/exceljs.min.js vendor/exceljs.min.js
          for p in pdfjs-dist pdf-lib @pdf-lib/fontkit mammoth exceljs; do
            n=$(echo $p | tr '/@' '__'); cp $N/$p/LICENSE* vendor/licenses/$n.txt 2>/dev/null || true
          done
          ls -la vendor
      - name: Salva nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add vendor
          git diff --cached --quiet || git commit -m "Librerie in vendor/ (versioni fisse)"
          git push
